<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage | Westpac Prototype</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/homepage.css">
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
  <div class="header-inner d-flex justify-content-between align-items-center">
    <button class="hamburger-btn" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="logo-box">LOGO</div>
    <nav class="nav-buttons" id="navMenu">
      <a href="personal-banking.html" class="nav-btn">Personal</a>
      <a href="business-banking.html" class="nav-btn">Business</a>
      <a href="login.html" class="nav-btn">Login</a>
      <a href="contact.html" class="nav-btn">Contact Us</a>
    </nav>
  </div>
</header>

  <!-- HERO -->
  <section class="hero text-center">
    <div class="container">
      <h1>Hero banner headline</h1>
      <p>supporting subtext</p>
      <a href="personal-banking.html" class="btn btn-outline-cta">CTA Button</a>
    </div>
  </section>

  <!-- PRODUCT CARDS -->
  <section class="products py-5">
    <div class="container">
      <div class="row g-4">
        <div class="col-md-4">
          <div class="product-card">
            <div class="thumb"></div>
            <p class="fw-bold mb-1">Product Card</p>
            <p>Saving account</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="product-card">
            <div class="thumb"></div>
            <p class="fw-bold mb-1">Product Card</p>
            <p>Credit cards</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="product-card">
            <div class="thumb"></div>
            <p class="fw-bold mb-1">Product Card</p>
            <p>Home loans</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- CAROUSEL -->
  <section class="carousel-block text-center">
    <div class="container">
      <p class="fw-bold mb-1">Multimedia / carousel player block</p>
      <p class="mb-3">Image and video</p>

      <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active"></button>
          <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1"></button>
          <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="https://placehold.co/1200x300" class="d-block w-100" alt="Promotional slide 1">
          </div>
          <div class="carousel-item">
            <img src="https://placehold.co/1200x300" class="d-block w-100" alt="Promotional slide 2">
          </div>
          <div class="carousel-item">
            <img src="https://placehold.co/1200x300" class="d-block w-100" alt="Promotional slide 3">
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- CONTACT FORM -->
  <section class="contact-block text-center">
    <div class="container">
      <p class="fw-bold mb-3">Contact us form</p>
      <form class="row g-2 justify-content-center align-items-center">
        <div class="col-auto">
          <input type="text" class="form-control" placeholder="Name field" required>
        </div>
        <div class="col-auto">
          <input type="email" class="form-control" placeholder="Email field" required>
        </div>
        <div class="col-auto">
          <input type="text" class="form-control" placeholder="Message" required>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-submit">Submit</button>
        </div>
      </form>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="site-footer text-center">
    <p class="mb-0">Footer – links, copyright, socials</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
