<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Westpac Prototype</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/contact.css">
</head>
<body>

  <!-- ============================================
     HEADER: Logo + responsive nav (hamburger on
     tablet/mobile via nav.js)
     ============================================ -->

<header class="site-header">
  <div class="header-inner d-flex justify-content-between align-items-center">
    <button class="hamburger-btn" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <a href="index.html" class="logo-box">
      <img src="images/logo.jpg.jpg" alt="Westpac Prototype logo" class="logo-img">
    </a>
    <nav class="nav-buttons" id="navMenu">
      <a href="personal-banking.html" class="nav-btn">Personal</a>
      <a href="business-banking.html" class="nav-btn">Business</a>
      <a href="login.html" class="nav-btn">Login</a>
    </nav>
  </div>
</header>


<!-- ============================================
     CONTACT FORM: Validated client-side via
     js/form-validation.js
     ============================================ -->

  <!-- CONTACT FORM -->
  <section class="contact-section d-flex justify-content-center">
    <div class="contact-card text-center">
      <p class="fw-bold mb-4">Contact us form</p>

      <form id="contactForm" novalidate>
        <div class="mb-3">
          <input type="text" id="nameField" class="form-control field-box" placeholder="Name field">
          <small class="error-text" id="nameError"></small>
        </div>

        <div class="mb-3">
          <input type="email" id="emailField" class="form-control field-box" placeholder="Email field">
          <small class="error-text" id="emailError"></small>
        </div>

        <div class="mb-3">
          <textarea id="messageField" class="form-control field-box" placeholder="Message" rows="4"></textarea>
          <small class="error-text" id="messageError"></small>
        </div>

        <button type="submit" class="btn field-box btn-submit">Submit</button>

        <p class="success-text mt-3" id="formSuccess"></p>
      </form>
    </div>
  </section>

  <!-- ============================================
     FOOTER
     ============================================ -->
     

 <footer class="site-footer text-center">
  <p class="mb-0">Footer – links, copyright, socials</p>
  <p class="disclaimer-text mb-0">This is a student prototype created for educational purposes only and is not affiliated with, endorsed by, or connected to Westpac Banking Corporation.</p>
</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/form-validation.js"></script>
</body>
</html>
