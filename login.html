<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Westpac Prototype</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- HEADER (same as homepage, no Login button since we're on this page) -->
  <header class="site-header">
  <div class="header-inner d-flex justify-content-between align-items-center">
    <button class="hamburger-btn" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="logo-box">LOGO</div>
    <nav class="nav-buttons" id="navMenu">
      <a href="personal-banking.html" class="nav-btn">Personal</a>
      <a href="business-banking.html" class="nav-btn">Business</a>
      <a href="contact.html" class="nav-btn">Contact Us</a>
    </nav>
  </div>
</header>

  <!-- LOGIN CARD -->
  <section class="login-section d-flex justify-content-center">
    <div class="login-card">
      <h2 class="text-center">Log in to internet banking</h2>

      <form id="loginForm">
        <input type="text" class="form-control field-box" placeholder="Customer ID field" required>

        <input type="password" class="form-control field-box" placeholder="Password field" required>

        <div class="remember-me">
          <input type="checkbox" id="rememberMe">
          <label for="rememberMe">Remember me</label>
        </div>

        <button type="submit" class="btn field-box btn-login">Log in Button</button>
      </form>

      <p class="text-center link-text underline-link">Forgot customer ID or Password?</p>
      <p class="text-center link-text">New customer? Register here</p>

      <div class="security-badge field-box text-center">Security Badge</div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="site-footer text-center">
    <p class="mb-0">Footer – links, copyright, socials</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/form-validation.js"></script>
</body>
</html>
